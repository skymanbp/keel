# Windows + macOS CI for the dataframe monorepo.
# Companion to ci.yml (ubuntu). Builds the maintainer-curated portable subset
# defined in cabal.project.ci — the same project file haskell-ci.yml is
# generated from — on windows-latest and macos-14. That subset already
# excludes the packages that cannot work here: examples and
# dataframe-hasktorch (libtorch is Linux/macOS-only and ~2 GB),
# dataframe-arrow (foreign-library), dataframe-fusion (needs system
# bzip2/xz/zlib -dev), dataframe-huggingface and dataframe-persistent.
#
# Two GHC versions per OS (the ends of the tested range) keep this at 4
# lanes; extend the matrix to 9.8.4/9.10.3 if runner minutes allow.
name: CI (Windows + macOS)

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: ${{ matrix.os }} / GHC ${{ matrix.ghc }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
        ghc: ["9.6.7", "9.12.2"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up GHC ${{ matrix.ghc }}
        id: setup
        uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: latest

      - name: Freeze
        run: cabal freeze --project-file=cabal.project.ci

      - name: Cache cabal store
        uses: actions/cache@v4
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: ${{ runner.os }}-ghc-${{ matrix.ghc }}-${{ hashFiles('cabal.project.ci.freeze') }}
          restore-keys: ${{ runner.os }}-ghc-${{ matrix.ghc }}-

      - name: Build (cabal.project.ci subset)
        run: cabal build all --project-file=cabal.project.ci

      - name: Test (cabal.project.ci subset)
        run: cabal test all --project-file=cabal.project.ci
