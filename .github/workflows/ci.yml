name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    name: ${{ matrix.os }} / ghc-${{ matrix.ghc }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.ghc == '9.14.1' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
        ghc: ['9.10.3', '9.12.4', '9.14.1']
    # Conformance suites SKIP when a dependency is missing; on CI every
    # dependency is provisioned, so a SKIP is a regression — require them.
    # (The linalg REQUIREs are set per-OS by the OpenBLAS install steps
    # below — apt on Linux, brew on macOS, keel setup on Windows.)
    env:
      KEEL_ABI_REQUIRE_PYARROW: '1'
      KEEL_ABI_REQUIRE_NUMPY: '1'
      KEEL_ONNX_REQUIRE: '1'

    steps:
      - uses: actions/checkout@v4

      - name: Set up GHC ${{ matrix.ghc }}
        id: setup
        uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: 'latest'

      - name: Set up Python (conformance oracles)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python oracle packages
        run: pip install numpy pyarrow onnxruntime scikit-learn skl2onnx

      - name: Install OpenBLAS (Linux)
        if: runner.os == 'Linux'
        run: |
          # Debian splits packaging: CBLAS lives in libopenblas, the
          # LAPACKE C interface in liblapacke - keel-linalg handles the
          # split at run time, both packages are needed
          sudo apt-get update && sudo apt-get install -y libopenblas0 libopenblas-dev liblapacke liblapacke-dev
          sudo ldconfig
          P=$(ldconfig -p | grep -m1 'libopenblas\.so\.0' | awk '{print $NF}')
          if [ -z "$P" ]; then P=$(find /usr/lib -name 'libopenblas.so*' | head -1); fi
          echo "found OpenBLAS at: $P"
          test -n "$P"
          echo "KEEL_OPENBLAS=$P" >> "$GITHUB_ENV"
          echo "KEEL_LINALG_REQUIRE_OPENBLAS=1" >> "$GITHUB_ENV"
          echo "KEEL_LINALG_REQUIRE_ORACLE=1" >> "$GITHUB_ENV"

      - name: Install OpenBLAS (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install openblas
          echo "KEEL_OPENBLAS=$(brew --prefix openblas)/lib/libopenblas.dylib" >> "$GITHUB_ENV"
          echo "KEEL_LINALG_REQUIRE_OPENBLAS=1" >> "$GITHUB_ENV"
          echo "KEEL_LINALG_REQUIRE_ORACLE=1" >> "$GITHUB_ENV"

      - name: Cache cabal store
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.setup.outputs.cabal-store }}
            dist-newstyle
          key: ${{ runner.os }}-ghc${{ matrix.ghc }}-${{ hashFiles('**/*.cabal', 'cabal.project') }}
          restore-keys: ${{ runner.os }}-ghc${{ matrix.ghc }}-

      - name: Build
        run: cabal build all --enable-tests

      # Also an end-to-end test of keel setup itself: download the
      # pinned official archive, verify SHA-256, install to the keel
      # data dir — which the linalg suites then resolve from.
      - name: Install OpenBLAS via keel setup (Windows)
        if: runner.os == 'Windows'
        run: |
          cabal run keel -- setup blas
          echo "KEEL_LINALG_REQUIRE_OPENBLAS=1" >> $env:GITHUB_ENV
          echo "KEEL_LINALG_REQUIRE_ORACLE=1" >> $env:GITHUB_ENV

      - name: Test
        run: cabal test all --test-show-details=direct
